<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
     <main class="dashboard-container">

        <h1>Life Hub V.1</h1>

        <p>Building a better way to organize my goals and my life.</p>

        <h2>My Goals</h2>

        <div class="goals-grid">
            {% for goal in goals %}
                <div class="goal-card">
                    <h3>{{ goal["title"] }}</h3>

                    <p>{{ goal["category"] }}</p>

                        <p>Progress: {{ goal["progress_percent"] }}%</p>

                            <div class="progress-bar">
                                    <div
                                        class="progress-fill"
                                        style="width: {{ goal['progress_percent'] }}%;">
                                    </div>
                                </div>
                </div>
                
            {% endfor %}
        </div>
    </main>
</body>
</html>
